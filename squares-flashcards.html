<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squares Flashcards (1-100)</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --accent: #4f46e5;
    --accent-dark: #3730a3;
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f4f6fb 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(79,70,229,0.08);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(31,41,55,0.08);
    padding: 32px 40px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.8rem;
    margin: 8px 0 4px;
    text-align: center;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 22px;
    text-align: center;
    font-size: 0.95rem;
  }
  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .stats span b { color: var(--text); }
  .progress-bar {
    width: 100%;
    max-width: 420px;
    height: 6px;
    background: #e5e7eb;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 0.25s ease;
  }
  .progress-caption {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .reset-link {
    background: none;
    border: none;
    color: var(--muted);
    text-decoration: underline;
    font-size: 0.75rem;
    cursor: pointer;
    margin-top: 6px;
  }
  .difficulty-badge {
    position: absolute;
    top: 14px;
    right: 18px;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }
  .badge-new { background: #e0e7ff; color: var(--accent-dark); }
  .badge-easy { background: #dcfce7; color: var(--green); }
  .badge-medium { background: #fef3c7; color: var(--amber); }
  .badge-hard { background: #fee2e2; color: var(--red); }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 10px;
  }
  button.action {
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  button.action:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: #e5e7eb; color: var(--text); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary:hover { background: #d1d5db; }

  .quiz-box {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(31,41,55,0.12);
    padding: 40px 32px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
  }
  .quiz-question {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .quiz-number {
    font-size: 3.4rem;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 18px;
  }
  .quiz-input {
    width: 100%;
    font-size: 1.4rem;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    border: 2px solid #e5e7eb;
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.15s ease;
  }
  .quiz-input:focus { border-color: var(--accent); }
  .quiz-input.correct { border-color: var(--green); background: #f0fdf4; }
  .quiz-input.wrong { border-color: var(--red); background: #fef2f2; }
  .feedback {
    min-height: 24px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .feedback.correct { color: var(--green); }
  .feedback.wrong { color: var(--red); }
  footer {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
  @media (max-width: 480px) {
    .app { padding: 22px 18px 28px; border-radius: 20px; }
  }
</style>
</head>
<body>

<div class="app">

<h1>🔢 Squares Quiz</h1>
<p class="subtitle">Numbers 1&ndash;100 &mdash; the ones you struggle with come back more often.</p>

<div class="stats">
  <span>Attempts <b id="statAttempts">0</b></span>
  <span>Accuracy <b id="statAccuracy">&mdash;</b></span>
  <span>Mastered <b id="statMastered">0</b> / 100</span>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-caption">Mastery progress</div>

<div class="quiz-box">
  <span class="difficulty-badge" id="badgeQuiz">New</span>
  <div class="quiz-question">What is this number squared?</div>
  <div class="quiz-number" id="quizNumber">1</div>
  <input type="number" inputmode="numeric" class="quiz-input" id="quizInput" placeholder="Your answer" autocomplete="off">
  <div class="feedback" id="quizFeedback"></div>
</div>
<div class="controls">
  <button class="action btn-secondary" id="quizSkipBtn">Skip</button>
  <button class="action btn-primary" id="quizCheckBtn">Check</button>
</div>

<button class="reset-link" id="resetBtn">Reset progress</button>

<footer>
  Harder numbers are shown more often, based on how long they take you and whether you get them right
</footer>

</div>

<script>
(function() {
  const deck = Array.from({length: 100}, (_, i) => i + 1);
  const STORAGE_KEY = 'squareFlashcardStats_v1';
  const DEFAULT_WEIGHT = 5;
  const MASTERED_THRESHOLD = 2;

  let stats = loadStats();
  let currentNumber = 1;
  let cardShownAt = Date.now();

  const badgeQuiz = document.getElementById('badgeQuiz');
  const statAttempts = document.getElementById('statAttempts');
  const statAccuracy = document.getElementById('statAccuracy');
  const statMastered = document.getElementById('statMastered');
  const progressFill = document.getElementById('progressFill');
  const resetBtn = document.getElementById('resetBtn');

  const quizNumber = document.getElementById('quizNumber');
  const quizInput = document.getElementById('quizInput');
  const quizFeedback = document.getElementById('quizFeedback');
  const quizCheckBtn = document.getElementById('quizCheckBtn');
  const quizSkipBtn = document.getElementById('quizSkipBtn');

  function loadStats() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore corrupt storage */ }
    return {};
  }

  function saveStats() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
    } catch (e) { /* storage unavailable, keep going in-memory */ }
  }

  function getStat(n) {
    return stats[n] || { weight: DEFAULT_WEIGHT, attempts: 0, correct: 0 };
  }

  function weightOf(n) {
    return getStat(n).weight;
  }

  // Weighted random pick: harder (higher-weight) numbers are more likely.
  function pickWeighted(exclude) {
    const candidates = deck.filter(n => n !== exclude);
    const weights = candidates.map(weightOf);
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < candidates.length; i++) {
      r -= weights[i];
      if (r <= 0) return candidates[i];
    }
    return candidates[candidates.length - 1];
  }

  // correct: boolean, timeMs: how long it took to answer
  function updateWeight(n, correct, timeMs) {
    const s = getStat(n);
    s.attempts++;
    if (correct) s.correct++;
    const seconds = timeMs / 1000;
    let delta;
    if (!correct) {
      delta = 8;
    } else if (seconds <= 2.5) {
      delta = -3;
    } else if (seconds <= 6) {
      delta = -1;
    } else {
      delta = 3; // correct but slow still counts as tricky
    }
    s.weight = Math.min(40, Math.max(1, s.weight + delta));
    s.lastSeen = Date.now();
    stats[n] = s;
    saveStats();
    updateGlobalStatsUI();
  }

  function updateGlobalStatsUI() {
    let totalAttempts = 0, totalCorrect = 0, mastered = 0;
    deck.forEach(n => {
      const s = getStat(n);
      totalAttempts += s.attempts;
      totalCorrect += s.correct;
      if (s.attempts > 0 && s.weight <= MASTERED_THRESHOLD) mastered++;
    });
    statAttempts.textContent = totalAttempts;
    statAccuracy.textContent = totalAttempts ? Math.round(totalCorrect / totalAttempts * 100) + '%' : '—';
    statMastered.textContent = mastered;
    progressFill.style.width = mastered + '%';
  }

  function difficultyTier(n) {
    const s = getStat(n);
    if (s.attempts === 0) return { label: 'New', cls: 'badge-new' };
    if (s.weight <= 2) return { label: 'Easy', cls: 'badge-easy' };
    if (s.weight <= 8) return { label: 'Medium', cls: 'badge-medium' };
    return { label: 'Hard', cls: 'badge-hard' };
  }

  function applyBadge(n) {
    const tier = difficultyTier(n);
    badgeQuiz.textContent = tier.label;
    badgeQuiz.className = 'difficulty-badge ' + tier.cls;
  }

  function showNumber(n) {
    currentNumber = n;
    cardShownAt = Date.now();
    quizNumber.textContent = n;
    applyBadge(n);
    quizInput.value = '';
    quizInput.classList.remove('correct', 'wrong');
    quizInput.disabled = false;
    quizFeedback.textContent = '';
    quizFeedback.className = 'feedback';
    quizInput.focus();
  }

  function checkAnswer() {
    const n = currentNumber;
    const correctAnswer = n * n;
    const userAnswer = parseInt(quizInput.value, 10);
    const timeMs = Date.now() - cardShownAt;
    const correct = userAnswer === correctAnswer;
    updateWeight(n, correct, timeMs);
    quizInput.disabled = true;
    if (correct) {
      quizInput.classList.add('correct');
      quizFeedback.textContent = 'Correct! 🎉';
      quizFeedback.classList.add('correct');
    } else {
      quizInput.classList.add('wrong');
      quizFeedback.textContent = `Not quite. ${n}² = ${correctAnswer}`;
      quizFeedback.classList.add('wrong');
    }
    setTimeout(() => {
      showNumber(pickWeighted(n));
    }, 1100);
  }

  function skipQuiz() {
    showNumber(pickWeighted(currentNumber));
  }

  function resetProgress() {
    if (!confirm('Reset all difficulty tracking and stats? This cannot be undone.')) return;
    stats = {};
    saveStats();
    updateGlobalStatsUI();
    showNumber(pickWeighted(currentNumber));
  }

  quizCheckBtn.addEventListener('click', checkAnswer);
  quizSkipBtn.addEventListener('click', skipQuiz);
  resetBtn.addEventListener('click', resetProgress);

  quizInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !quizInput.disabled) checkAnswer();
  });

  // init
  updateGlobalStatsUI();
  showNumber(pickWeighted(null));
})();
</script>

</body>
</html>
